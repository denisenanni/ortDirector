# Empty app, in Italian whatever the simulator's language, on Piante.
appId: com.devdenise.ortdirector
tags:
  - subflow
---
- launchApp:
    clearState: true
    permissions:
      notifications: ${NOTIFICATIONS || 'allow'}
# A fresh install sets up its database first: wait for Oggi before tapping.
- extendedWaitUntil:
    visible: "(Oggi|Today)"
    timeout: 20000
- waitForAnimationToEnd
# A tap that lands while the app is still starting is lost, so try again.
- retry:
    maxRetries: 3
    commands:
      - tapOn: "(Impostazioni|Settings), tab.*"
      - assertVisible: "Italiano"
- tapOn: "Italiano"
- tapOn: "Piante, tab.*"
