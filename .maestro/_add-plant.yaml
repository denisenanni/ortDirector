# Adds a catalog plant from Piante. env: PLANT (as in the catalog), STAGE
# (Seminata, A dimora in terra…), COVERED (true to tick "Al coperto").
appId: com.devdenise.ortdirector
tags:
  - subflow
---
- tapOn: "Aggiungi pianta"
- tapOn: "Cerca: pomodoro.*"
# Only the start of the name: Maestro matches text ignoring case, so the full
# name in the search box would match too, and the tap would miss the chip.
- inputText: ${PLANT.slice(0, 4).toLowerCase()}
- tapOn: ${PLANT}
# hideKeyboard can't close it on iOS; Enter submits the search field, which closes it.
- pressKey: Enter
- tapOn: ${STAGE || 'A dimora in terra'}
- tapOn: "30 giorni fa"
- runFlow:
    when:
      true: ${COVERED == 'true'}
    commands:
      - scrollUntilVisible:
          element: "Al coperto.*"
      - tapOn: "Al coperto.*"
- scrollUntilVisible:
    element: "Salva"
- tapOn: "Salva"
# Saved: the new plant's page replaces the form.
- assertNotVisible: "Cerca nel catalogo"
# Back to Oggi, as when you open the app.
- launchApp
